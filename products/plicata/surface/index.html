<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PLICATA · Full WebUI preview</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,#surface,button,summary,select,[role="button"],[role="slider"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    input:not([type="text"]):not([type="search"]):not([type="number"]){-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    input[type="text"],input[type="search"],input[type="number"],textarea,[contenteditable="true"]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
    button,summary,select,input,[role="button"]{touch-action:manipulation}
    button:focus:not(:focus-visible),summary:focus:not(:focus-visible){outline:none}
    html,body{margin:0;width:100%;height:100%;min-width:100%;min-height:100%;overflow:hidden;overscroll-behavior:none;background:#000}
    body{display:grid;place-items:start center;padding:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
    #surface{width:100%;height:100%;min-height:0;padding:0;display:grid;place-items:start center;overflow:hidden;background:#000}
    html[data-ppw-center-surface='1'] body,html[data-ppw-center-surface='1'] #surface{place-items:center}
    #status{position:fixed;left:8px;bottom:7px;z-index:9999;padding:3px 6px;border-radius:5px;background:rgba(25,23,19,.78);color:#f2ead9;font:700 7px/1.2 ui-monospace,monospace;pointer-events:none;opacity:0;transition:opacity .18s}
    #status[data-visible="1"]{opacity:1}
  </style>
  <script src="./surface_runtime_v1.js"></script>
  <link rel="stylesheet" href="./plicata-responsive.css">
</head>
<body data-plicata-experiment="1" data-plicata-native-viewport="1">
  <main id="surface"></main>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="./web-preview-host.js"></script>
<script type="module" src="./moog-au-host.mjs"></script>
</body>
</html>
